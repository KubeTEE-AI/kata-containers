# Build the KubeTEE repacked kata-deploy image: upstream's official kata-deploy
# with ONLY the runtime-rs shim (containerd-shim-kata-v2) replaced by our
# patched build (fix15 / kata-containers#11649 + fdset-reclaim hardening).
# See tools/packaging/kata-deploy/repack/Dockerfile for the rationale and the
# exact swap surface. Consumed by fleet-gitops/infrastructure/kata-deploy
# via image.reference (digest-pinned).
#
# Image: ghcr.io/kubetee-ai/kata-deploy
# Tags:  <tag> (e.g. 4.3.1-fix11649) and kata-containers-<sha>-amd64.
#
# Security: workflow_dispatch inputs flow only through env: (never interpolated
# into run: script text) — injection-safe by construction.

name: build-kata-deploy-repack

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 4.3.1-fix11649)"
        required: false
        default: "4.3.1-fix11649"
      base_image:
        description: "Upstream base (linux/amd64 manifest digest preferred)"
        required: false
        default: "quay.io/kata-containers/kata-deploy@sha256:799c17dcbd6f2c93f2c84f69667aa74b250ce91986096cc990a12abfc8871799"
  push:
    branches:
      - kubetee-fix11649-4.3.1

concurrency:
  group: kata-deploy-repack-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: [self-hosted, Linux, X64]
    env:
      IMAGE_REPO: ghcr.io/kubetee-ai/kata-deploy
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_BASE_IMAGE: ${{ inputs.base_image }}
    steps:
      - name: Checkout kata-containers fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve build parameters
        run: |
          set -eux
          IMAGE_TAG="${INPUT_TAG:-4.3.1-fix11649}"
          BASE_IMAGE="${INPUT_BASE_IMAGE:-quay.io/kata-containers/kata-deploy@sha256:799c17dcbd6f2c93f2c84f69667aa74b250ce91986096cc990a12abfc8871799}"
          COMMIT_SHA="${GITHUB_SHA}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "${GITHUB_ENV}"
          echo "BASE_IMAGE=${BASE_IMAGE}" >> "${GITHUB_ENV}"
          echo "COMMIT_SHA=${COMMIT_SHA}" >> "${GITHUB_ENV}"

      - name: Login to ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch marker gate (classes carried vs consciously dropped)
        run: |
          set -eux
          echo "== fix15 / kata-containers#11649 idempotent block hotplug (REQUIRED) =="
          grep -n 'DEFAULT_QMP_HOTPLUG_READ_TIMEOUT' src/runtime-rs/crates/hypervisor/src/qemu/qmp.rs | head -5
          grep -n 'existing_block_hotplug' src/runtime-rs/crates/hypervisor/src/qemu/qmp.rs | head -5
          grep -n 'remove_fdset_ids' src/runtime-rs/crates/hypervisor/src/qemu/qmp.rs | head -5
          echo "== fix15-hardening fdset reclaim (REQUIRED) =="
          grep -n 'fdset_entry_is_stale' src/runtime-rs/crates/hypervisor/src/qemu/qmp.rs | head -5
          echo "== classifier unit tests (REQUIRED) =="
          grep -n 'mod tests_fix15' src/runtime-rs/crates/hypervisor/src/qemu/qmp.rs | head -5
          echo "== fix16 / kata-containers#13641 inotify (CONSCIOUSLY DROPPED — must be absent) =="
          if grep -nE 'InotifyCloseOnThread|kata-inotify-close' src/runtime-rs/crates/resource/src/volume/share_fs_volume.rs; then
            echo "UNEXPECTED fix16 marker present"; exit 1
          fi
          echo "== T15/T16 / kata-containers#13665+#13746 stop_vm (CONSCIOUSLY DROPPED — must be absent) =="
          if grep -nE 'should_stop_vm_on_missing_task|guest_map_is_empty' \
              src/runtime-rs/crates/runtimes/common/src/container_manager.rs \
              src/runtime-rs/crates/runtimes/src/manager.rs \
              src/runtime-rs/crates/runtimes/virt_container/src/container_manager/manager.rs; then
            echo "UNEXPECTED T15/T16 marker present"; exit 1
          fi
          git log --oneline -3

      - name: Install build/test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools clang llvm protobuf-compiler libseccomp-dev pkg-config

      - name: Install Rust toolchain (pinned 1.97 via rust-toolchain.toml)
        run: |
          rustup toolchain install 1.97.0 || true
          rustup default 1.97.0
          rustup target add x86_64-unknown-linux-musl

      - name: Classifier unit tests (qmp.rs tests_fix15*)
        run: |
          set -eux
          cargo test -p hypervisor tests_fix15 -- --nocapture

      - name: Build + push repacked kata-deploy (linux/amd64 only)
        run: |
          set -eux
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --build-arg KATA_GIT_COMMIT="${COMMIT_SHA}" \
            -f tools/packaging/kata-deploy/repack/Dockerfile \
            --provenance false --sbom false \
            --tag "${IMAGE_REPO}:${IMAGE_TAG}" \
            --tag "${IMAGE_REPO}:kata-containers-${COMMIT_SHA}-amd64" \
            --push .

      - name: Post-push verification (shim sha + config TOMLs intact)
        run: |
          set -eux
          IMG="${IMAGE_REPO}:${IMAGE_TAG}"
          CID="$(docker create "${IMG}")"
          docker cp "${CID}:/opt/kata-artifacts/tarballs/kata-static-shim-v2-rust.tar.zst" /tmp/verify-shim-v2-rust.tar.zst
          docker cp "${CID}:/opt/kata-artifacts/kubetee-repack-info.txt" /tmp/verify-repack-info.txt
          docker rm "${CID}" >/dev/null
          zstd -dc /tmp/verify-shim-v2-rust.tar.zst | tar -xf - -C /tmp ./opt/kata/runtime-rs/bin/containerd-shim-kata-v2
          SHIM_SHA256="$(sha256sum /tmp/opt/kata/runtime-rs/bin/containerd-shim-kata-v2 | awk '{print $1}')"
          INFO_SHA256="$(awk -F= '/^shim_sha256=/{print $2}' /tmp/verify-repack-info.txt)"
          echo "shim sha256 (extracted): ${SHIM_SHA256}"
          echo "shim sha256 (info file): ${INFO_SHA256}"
          test "${SHIM_SHA256}" = "${INFO_SHA256}"
          file /tmp/opt/kata/runtime-rs/bin/containerd-shim-kata-v2 | grep -E 'ELF 64-bit.*x86-64.*statically linked'
          TOML_COUNT="$(zstd -dc /tmp/verify-shim-v2-rust.tar.zst | tar -tf - | grep -c '\.toml')"
          echo "config TOMLs in repacked tarball: ${TOML_COUNT}"
          test "${TOML_COUNT}" -eq 12
          zstd -dc /tmp/verify-shim-v2-rust.tar.zst | tar -tf - | grep configuration-qemu-tdx-runtime-rs.toml
          cat /tmp/verify-repack-info.txt
          echo "== image manifest digest (digest-pin this in values.yaml) =="
          docker buildx imagetools inspect "${IMG}" | head -4
          {
            echo "## kata-deploy repack ${IMAGE_TAG}"
            echo "- shim sha256: \`${SHIM_SHA256}\` (pin this in the CC post-reboot checklist)"
            echo '```'
            cat /tmp/verify-repack-info.txt
            echo '```'
            docker buildx imagetools inspect "${IMG}" | head -4
          } >> "${GITHUB_STEP_SUMMARY}"
