apiVersion: v1
kind: Pod
metadata:
  name: test-vfio-complete
  namespace: nemo
spec:
  restartPolicy: Never
  runtimeClassName: kata-qemu-nvidia-gpu
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
  containers:
  - name: test-vfio-complete
    image: nvcr.io/nvidia/cuda:11.6.0-base-ubuntu20.04
    command: ["/bin/bash", "-c", "ls -la /dev/vfio/ && echo '---' && find /sys/bus/pci/devices -name '0000:*' | head -5"]
    securityContext:
      privileged: true
    volumeMounts:
    - name: vfio-devices
      mountPath: /dev/vfio
    - name: pci-devices
      mountPath: /sys/bus/pci/devices
  volumes:
  - name: vfio-devices
    hostPath:
      path: /dev/vfio
      type: Directory
  - name: pci-devices
    hostPath:
      path: /sys/bus/pci/devices
      type: Directory

