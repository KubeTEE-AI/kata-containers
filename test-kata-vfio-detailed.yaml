apiVersion: v1
kind: Pod
metadata:
  name: test-kata-vfio-detailed
  namespace: nemo
spec:
  restartPolicy: Never
  runtimeClassName: kata-qemu-nvidia-gpu
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
  containers:
  - name: test-vfio-detailed
    image: nvcr.io/nvidia/cuda:11.6.0-base-ubuntu20.04
    command: ["/bin/bash", "-c", "ls -la /dev/vfio/ && echo '---' && ls -la /dev/vfio/* && echo '---' && cat /proc/devices | grep vfio"]
    securityContext:
      privileged: true
    volumeMounts:
    - name: vfio-devices
      mountPath: /dev/vfio
  volumes:
  - name: vfio-devices
    hostPath:
      path: /dev/vfio
      type: Directory

